<svg width="400" height="200" viewBox="0 0 400 200" xmlns="http://www.w3.org/2000/svg">
    <!-- Background -->
    <defs>
        <linearGradient id="logoGradient" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
        </linearGradient>
    </defs>

    <!-- Keel Symbol (Stylized Boat Keel) -->
    <g transform="translate(60, 60)">
        <!-- Keel shape -->
        <path d="M 40 0 L 60 40 L 40 80 L 20 40 Z" fill="url(#logoGradient)" />
        <path d="M 40 0 L 60 40 L 40 80 L 20 40 Z" fill="none" stroke="#fff" stroke-width="2" opacity="0.3"/>

        <!-- Additional design elements -->
        <circle cx="40" cy="40" r="8" fill="#fff" opacity="0.9"/>
        <line x1="40" y1="10" x2="40" y2="70" stroke="#fff" stroke-width="2" opacity="0.5"/>
    </g>

    <!-- Text -->
    <text x="140" y="90" font-family="Arial, sans-serif" font-size="48" font-weight="bold" fill="#2d3748">
        KEEL
    </text>
    <text x="140" y="125" font-family="Arial, sans-serif" font-size="32" font-weight="300" fill="#667eea">
        CFO
    </text>
</svg>
